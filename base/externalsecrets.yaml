# Secrets come from Vault through the External Secrets Operator.
# No secret value appears in this repository.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cert-secrets
  namespace: cert
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: arca-cert-vault-backend
    kind: ClusterSecretStore
  target:
    name: cert-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: arca/cert/database
        property: url
    - secretKey: VAULT_ROLE
      remoteRef:
        key: arca/cert/vault
        property: role
