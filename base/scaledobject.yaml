apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: cert
  namespace: cert
spec:
  scaleTargetRef:
    name: cert
  minReplicaCount: 0
  maxReplicaCount: 10
  cooldownPeriod: 300
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka.platform.svc.cluster.local:9092
        consumerGroup: cert-workers
        topic: cert.dossier.built
        lagThreshold: "100"
