apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert
  namespace: cert
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert
  namespace: cert
subjects:
  - kind: ServiceAccount
    name: cert
    namespace: cert
roleRef:
  kind: Role
  name: cert
  apiGroup: rbac.authorization.k8s.io
